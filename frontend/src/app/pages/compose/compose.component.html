<div class="page-container">
    <header>
      <h1>{{ title }}</h1>
      <p class="broadcast-url">{{ getBroadcastStatus() }}</p>
    </header>

    <main>
      <div class="broadcast-area" *ngIf="!isBroadcastEnded">
        <div class="start-broadcast" *ngIf="!isBroadcastStarted; else broadcastContent">
          <button 
            class="start-btn" 
            [disabled]="!isConnected"
            (click)="startBroadcast()"
          >
            <span class="icon">🎙️</span>
            Start Broadcasting
          </button>
        </div>

        <ng-template #broadcastContent>
          <div class="content-area">
            <textarea
              class="message-input"
              placeholder="Start typing your message..."
              (keydown)="onKeystroke($event)"
              [attr.disabled]="!isConnected || null"
            ></textarea>
          </div>

          <div class="actions">
            <div class="broadcast-controls">
              <button class="stop-btn" (click)="endBroadcast()">
                <span class="icon">⏹️</span>
              </button>
              <span class="timer">{{ formatTime(elapsedTime) }}</span>
            </div>
          </div>
        </ng-template>
      </div>

      <div class="replay-area" *ngIf="isBroadcastEnded">
        <app-replay-viewer
          [title]="broadcastKey"
          [recordingData]="recording"
        ></app-replay-viewer>
        
        <div class="actions">
          <button class="download-btn" (click)="downloadRecording()">
            <span class="icon">💾</span>
            Download Recording
          </button>
        </div>
      </div>
    </main>
  </div>
