<div class="broadcast-access">
  <div class="url-input">
    <span class="prefix">miab.local/</span>
    <input 
      type="text" 
      [(ngModel)]="urlPath"
      placeholder="enter-broadcast-url"
      (input)="validateUrl()"
      (keyup.enter)="onConnect()"
    >
  </div>
  <button 
    class="connect-btn" 
    [disabled]="!isUrlValid"
    (click)="onConnect()"
  >
    <span class="icon">📡</span>
    Connect
  </button>
</div>
