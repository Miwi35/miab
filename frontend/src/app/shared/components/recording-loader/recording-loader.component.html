<div class="recording-loader">
  <div class="drop-zone" [class.dragging]="isDragging">
    <div class="drop-content">
      <span class="icon">📁</span>
      <h3>Drop your .miab file here</h3>
      <p>or</p>
      <label class="upload-btn">
        Browse Files
        <input 
          type="file" 
          accept=".miab" 
          (change)="onFileSelected($event)" 
          style="display: none">
      </label>
    </div>
  </div>
</div>
