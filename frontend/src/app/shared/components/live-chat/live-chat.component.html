<div class="chat-container">
  <div class="chat-header">
    <h3>Live Chat</h3>
    <span class="participants">{{participantCount}} online</span>
  </div>

  <div class="messages-container" #messagesContainer>
    <div class="messages-wrapper">
      <div class="spacer"></div>
      <div class="message" *ngFor="let message of messages" 
           [ngClass]="{'message-self': message.username === 'me', 'message-op': message.username === 'OP', 'message-other': message.username !== 'me'}"
           [style.--user-color]="message.color">
        <div class="message-header">
          <span class="sender">{{ message.username }}</span>
          <span class="timestamp">{{ message.timestamp | date:'shortTime' }}</span>
        </div>
        <p class="content" [attr.data-username]="message.username">{{ message.content }}</p>
      </div>
    </div>
  </div>

  <div class="input-container">
    <input
      type="text"
      [(ngModel)]="newMessage"
      placeholder="Type a message..."
      (keyup.enter)="sendMessage()"
    >
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
