<div class="overlay">
  <div class="modal">
    <h2>Password Required</h2>
    <form (ngSubmit)="onSubmit()">
      <input 
        type="password" 
        [(ngModel)]="password" 
        name="password"
        placeholder="Enter password"
        autocomplete="off"
      >
      <button type="submit">Submit</button>
    </form>
  </div>
</div>
